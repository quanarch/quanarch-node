name: ci

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: quanarch/quanarch
          ref: dev
          path: .qu
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-go@v7
        with:
          go-version-file: .qu/go.mod
          cache-dependency-path: .qu/go.sum
      - name: Create a project from this stack and add a quan with a new qua
        run: go test -C .qu ./internal/create -run TestStackProject -count=1 -v
        env:
          QU_E2E_STACK_DIR: ${{ github.workspace }}
      - name: Build qu
        run: go build -C .qu -o "$RUNNER_TEMP/qu" ./cmd/qu
      - name: Build every part of a project made by qu
        working-directory: ${{ runner.temp }}
        env:
          QU_STACK_DIR: ${{ github.workspace }}
        run: |
          ./qu new project acme --lang node-ts --dir . --qua acme-qua --quanar acme-quanar --quan billing
          ./qu new qmock qmock --lang node-ts --dir acme --qua acme-qua
          ./qu new quan invoices --lang node-ts --dir acme --new-qua invoices-qua
          for quan in billing invoices; do
            (cd acme/quans/$quan && npm run typecheck && npm run build)
          done
          (cd acme/quanar && npm run build)
          (cd acme/qmock && npm run build)
      - name: A quan cannot run without a quanar
        working-directory: ${{ runner.temp }}/acme/quans/billing
        run: |
          if node dist/billing.js 2> err.txt; then echo "the quan ran by itself"; exit 1; fi
          grep -q "the quanar must call init() first" err.txt
      - name: The quanar listens for a quan only while the quan is there
        working-directory: ${{ runner.temp }}/acme
        run: |
          (cd quanar && npm start) & sleep 2
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/billing)" = 404
          (cd quans/billing && npm run watch) & sleep 4
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:3000/billing -H 'Content-Type: application/json' -d '{"text":"hi"}')" = 201
          curl -sf localhost:3000/billing | grep -q '"text":"hi"'
      - name: Create the advanced example with qu, build and type-check every part
        working-directory: ${{ runner.temp }}
        env:
          QU_STACK_DIR: ${{ github.workspace }}
        run: |
          ./qu new examples shop --lang node-ts --example advanced --dir .
          cd shop && npm run build && npm run typecheck
